<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>
    
</body>
</html>
    <style>
        body{
            background:#1e252f;
            color:white;
        }

        .box{
            width:70%;
            margin:auto;
            margin-top:60px;
            background:#808891;
            padding:40px;
            border-radius:10px;
        }
    </style>

</head>
<body>

<div class="box">

    <h1 class="text-center mb-4">
    ✏️ Edit Product
</h1>

<form method="POST">
    <div class="mb-3">
        <label for="product_name" class="form-label">Product Name</label>
        <input
            id="product_name"
            type="text"
            name="product_name"
            class="form-control"
            value="{{ product[1] }}"
            placeholder="Enter product name"
            title="Product Name"
        >
    </div>

    <div class="mb-3">
        <label for="price" class="form-label">Price</label>
        <input
            id="price"
            type="number"
            name="price"
            class="form-control"
            value="{{ product[2] }}"
            placeholder="Enter price"
            title="Price"
        >
    </div>

    <button type="submit" class="btn btn-warning">
        Update Product
    </button>

    <a href="/" class="btn btn-light">
        Back
    </a>
</form>

</div>

</body>
</html>
