<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
        }

        .box{
            width: 70%;
            margin: 60px auto;
            background: rgba(27, 56, 102, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,.3);
        }

        .form-control{
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.15);
            color: white;
        }

        .form-control:focus{
            background: rgba(255,255,255,.1);
            color: white;
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59,130,246,.4);
        }

        .form-control::placeholder{
            color: #cbd5e1;
        }

        .btn{
            border-radius: 10px;
        }

        .preview-img{
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,.2);
        }

        @media(max-width:768px){
            .box{
                width: 95%;
                padding: 20px;
            }
        }
    </style>

</head>

<body>

<div class="box">

    <h1 class="text-center mb-4">
        ✏️ Edit Product
    </h1>

    <!-- Current Image -->
    <div class="text-center mb-4">

        <img
            src="{{ url_for('static', filename='uploads/' ~ (product[3] or 'default.png')) }}"
            class="preview-img"
            alt="Product Image"
        >

    </div>

    <form method="POST" enctype="multipart/form-data">

        <div class="mb-3">

            <label for="product_name" class="form-label">
                Product Name
            </label>

            <input
                id="product_name"
                type="text"
                name="product_name"
                class="form-control"
                value="{{ product[1] }}"
                placeholder="Enter product name"
                required
            >

        </div>

        <div class="mb-3">

            <label for="price" class="form-label">
                Price
            </label>

            <input
                id="price"
                type="number"
                step="0.01"
                min="0"
                name="price"
                class="form-control"
                value="{{ product[2] }}"
                placeholder="Enter price"
                required
            >

        </div>

        <div class="mb-3">
            
            <label class="form-label">Quantity</label>

            <input
                id="quantity"
                type="number"
                name="quantity"
                class="form-control"
                value="{{ product[4] }}"
                min="0"
                required
            >
        </div>    


        <div class="mb-4">

            <label for="image" class="form-label">
                Product Image
            </label>

            <input
                id="image"
                type="file"
                name="image"
                class="form-control"
                accept="image/*"
            >

            <small class="text-secondary">
                Leave blank if you don't want to change the image.
            </small>

        </div>

        <div class="d-flex gap-2">

            <button type="submit" class="btn btn-warning">
                ✏️ Update Product
            </button>

            <a href="/" class="btn btn-light">
                ← Back
            </a>

        </div>

    </form>

</div>

</body>
</html>
