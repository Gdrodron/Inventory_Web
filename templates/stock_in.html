<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Stock In</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-dark text-light">

<div class="container mt-5">

    <div class="card bg-secondary p-4 shadow-lg">

        <h2 class="mb-4">
            📦 Stock In Product
        </h2>

        <div class="mb-3">

            <strong>Product:</strong>

            {{ product[1] }}

        </div>

        <div class="mb-3">

            <strong>Current Stock:</strong>

            {{ product[4] or 0 }}

        </div>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Quantity to Add
                </label>

                <input
                    type="number"
                    name="quantity"
                    class="form-control"
                    min="1"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-success"
            >
                ➕ Add Stock
            </button>

            <a
                href="/"
                class="btn btn-light"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
