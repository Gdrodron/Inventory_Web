<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div class="container mt-5">

    <h1 class="mb-4">
        📜 Transaction History
    </h1>

    <a href="/" class="btn btn-light mb-3">
        ← Back
    </a>

    <div class="mb-3">

        <a href="/transactions?search={{ request.args.get('search', '') }}"
            class="btn btn-secondary btn-sm">
            All
        </a>

        <a href="/transactions?type=STOCK IN&search={{ request.args.get('search', '') }}"
            class="btn btn-success btn-sm">
            STOCK IN
        </a>

        <a href="/transactions?type=STOCK OUT&search={{ request.args.get('search', '') }}"
            class="btn btn-danger btn-sm">
            STOCK OUT
        </a>

    </div>

    <div class="mb-3">

        <a href="/transactions?date=today"
            class="btn btn-info btn-sm">
            Today
        </a>

        <a href="/transactions?date=week"
            class="btn btn-primary btn-sm">
            This Week
        </a>

        <a href="/transactions?date=month"
            class="btn btn-warning btn-sm">
            This Month
        </a>

    </div>


    <form method="GET" action="/transactions" class="mb-3">

    <div class="input-group">

        <input
            type="text"
            name="search"
            class="form-control"
            placeholder="Search product or user..."
            value="{{ request.args.get('search', '') }}"
        >

        <button
            class="btn btn-primary"
            type="submit"
        >
            Search
        </button>

    </div>

    </form> 


    <div class="table-responsive">


        <table class="table table-dark table-hover" style="table-layout: fixed; width: 100%;">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product</th>
                    <th>User</th>
                    <th>Type</th>
                    <th>Quantity</th>
                    <th>Date</th>
                </tr>
            </thead>

            <tbody>

            {% for row in transactions %}

                <tr class="{% if row[3] == 'STOCK IN' %}stock-in-row{% else %}stock-out-row{% endif %}">

                    <td>{{ loop.index }}</td>
                    <td>{{ row[1] }}</td>
                    <td>{{ row[2] }}</td>

                    <td>
                        {% if row[3] == "STOCK IN" %}
                            <span class="badge bg-success">
                                STOCK IN
                            </span>
                        {% else %}
                            <span class="badge bg-danger">
                                STOCK OUT
                            </span>
                        {% endif %}
                    </td>

                    <td>{{ row[4] }}</td>
                    <td>{{ row[5] }}</td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
