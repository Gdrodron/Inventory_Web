<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#1e252f;
            color:white;
        }

        .login-box{
            width:400px;
            margin:auto;
            margin-top:100px;
            background:#808891;
            padding:40px;
            border-radius:10px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1 class="text-center mb-4">
        🔐 Login
    </h1>

    <form method="POST">

        <div class="mb-3">
            <label for="username" class="form-label">Username</label>

            <input
                id="username"
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter your username"
                title="Username"
            >
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>

            <input
                id="password"
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                title="Password"
            >
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Login
        </button>
    </form>

</div>

</body>
</html>
