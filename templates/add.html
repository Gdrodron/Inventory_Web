<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-dark text-light">

<div class="container mt-5">

    <div class="card bg-secondary p-4 shadow-lg rounded-4 border-0">

        <h1 class="text-center mb-4">
            ➕ Add Product
        </h1>

        <form method="POST" enctype="multipart/form-data">

            <!-- PRODUCT NAME -->
            <div class="mb-3">

                <label
                    for="product_name"
                    class="form-label"
                >
                    Product Name
                </label>

                
                <input
                    id="product_name"
                    type="text"
                    name="product_name"
                    class="form-control"
                    placeholder="Enter product name"
                    maxlength="100"
                    required
                >

            </div>

            <!-- CATEGORY -->
            <div class="mb-3">
                <label class="form-label" for="category">
                    Category
                </label>

                <select
                    id="category"
                    name="category"
                    class="form-control"
                    required
                >
                    <option value="">
                        Select Category
                    </option>
                    <option>Electronics</option>
                    <option>Food</option>
                    <option>Clothing</option>
                    <option>Office Supplies</option>
                </select>
            </div>

            <!-- PRICE -->
            <div class="mb-3">

                <label
                    for="price"
                    class="form-label"
                >
                    Price
                </label>

                <input
                    id="price"
                    type="number"
                    name="price"
                    class="form-control"
                    placeholder="Enter price"
                    min="0"
                    step="0.01"
                    value="0.00"
                    required
                >

            </div>

            <!-- QUANTITY -->
            <div class="mb-3">

                <label
                    for="quantity"
                    class="form-label"
    >
                    Quantity
                </label>

                <input
                    id="quantity"
                    type="number"
                    name="quantity"
                    class="form-control"
                    placeholder="Enter quantity"
                    min="0"
                    value="0"
                    required
                >

            </div>


            <!-- IMAGE -->
            <div class="mb-3">

                <label
                    for="image"
                    class="form-label"
                >
                    Product Image
                </label>

                <input
                    id="image"
                    type="file"
                    name="image"
                    class="form-control"
                    accept="image/*"
                >

            </div>

            <!-- BUTTONS -->
            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Product
                </button>

                <a
                    href="/"
                    class="btn btn-light"
                >
                    Back
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
